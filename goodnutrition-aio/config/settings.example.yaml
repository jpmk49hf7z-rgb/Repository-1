# Copy to config/settings.yaml and adjust. Optional — defaults are sensible.
#
# Model ids and token rates live here rather than in code because providers
# rename models and change prices more often than we change logic.
engines:
  claude:
    model: claude-opus-5
    max_searches: 5
  chatgpt:
    # Verify against the current OpenAI model list before a live run.
    model: gpt-5.6
    tool_type: web_search
    input_rate: 2.00      # USD per million input tokens
    output_rate: 12.00    # USD per million output tokens
  perplexity:
    model: sonar
    input_rate: 1.00
    output_rate: 1.00
  mock:
    visibility: 0.35      # probability the client is named, for dry runs
